name: 桂电美食分享 · 按需检查
on:
  workflow_dispatch:
  pull_request:
    paths: ['data/places/**']
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-places.mjs
