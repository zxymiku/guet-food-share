name: 桂电美食分享 · Android 发布
on:
  schedule:
    - cron: '0 2 * * 1' # 北京时间每周一 10:00，定时任务可能排队延迟
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      AMAP_ANDROID_KEY: ${{ secrets.AMAP_ANDROID_KEY }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing credential
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$SIGNING_STORE_PASSWORD" && test -n "$SIGNING_KEY_ALIAS"
          python - <<'PY'
          import os,base64,pathlib
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'guet-food-share.jks'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('SIGNING_KEYSTORE_PATH='+str(key)+'\n')
              out.write('VERSION_CODE='+str(1000+int(os.environ['VERSION_CODE']))+'\n')
          PY
      - name: Build signed application
        run: gradle -p android :app:assembleRelease --no-daemon
      - name: Prepare integrity manifest
        run: |
          mkdir -p release
          python - <<'PY'
          import os,pathlib,json,hashlib,shutil
          apk=pathlib.Path('android/app/build/outputs/apk/release/app-release.apk')
          name='guet-food-share-'+os.environ['VERSION_NAME']+'.apk'
          shutil.copy2(apk,pathlib.Path('release')/name)
          data={'appName':'桂电美食分享','packageName':'com.guet.foodshare','versionCode':int(os.environ['VERSION_CODE']),'versionName':os.environ['VERSION_NAME'],'assetName':name,'size':apk.stat().st_size,'sha256':hashlib.sha256(apk.read_bytes()).hexdigest()}
          pathlib.Path('release/update.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          pathlib.Path('release/notes.md').write_text('桂电美食分享 Android 应用。\n\n版本：'+data['versionName']+'\n\n包含签名 APK 与自动更新校验清单。安装及升级由 Android 系统确认。',encoding='utf-8')
          PY
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${VERSION_NAME}" release/*.apk release/update.json --title "桂电美食分享 ${VERSION_NAME}" --notes-file release/notes.md --target "$GITHUB_SHA" --latest
      - name: Remove runner signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/guet-food-share.jks"
